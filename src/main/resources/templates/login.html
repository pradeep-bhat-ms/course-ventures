<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CourseHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <a href="/" class="brand-logo" style="display: block; text-align: center; margin-bottom: 24px;">
                <i class="bi bi-rocket-takeoff-fill me-1"></i> CourseHub
            </a>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to access your courses and mock tests</p>

            <div th:if="${param.error}" class="alert alert-error">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid email or password / Account is not verified.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle-fill me-1"></i> You have been logged out successfully.
            </div>
            <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
            <div th:if="${loginError}" class="alert alert-error" th:text="${loginError}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Email Address</label>
                    <input type="email" id="username" name="username" class="form-control" placeholder="name@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <div style="text-align: right; margin-top: 8px;">
                        <a href="/forgot-password" style="color: var(--primary-color); text-decoration: none; font-size: 13px; font-weight: 500;">Forgot Password?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 14px;">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </button>
            </form>

            <p style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 14px;">
                Don't have an account? <a href="/register" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
