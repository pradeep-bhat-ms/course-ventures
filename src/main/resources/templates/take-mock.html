<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mockTest.title} + ' - CourseHub'">Mock Test - CourseHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="glass-header">
        <div class="container nav-wrapper">
            <a href="/" class="brand-logo"><i class="bi bi-rocket-takeoff-fill me-1"></i> CourseHub</a>
            <span style="font-weight: 600; color: var(--text-secondary);" th:text="${mockTest.title}">Mock Exam</span>
        </div>
    </header>

    <main class="container">
        <div id="quiz-screen" class="quiz-container">
            <!-- Header Bar with Timer -->
            <div class="quiz-header glass-panel">
                <div>
                    <h2 style="font-size: 20px; font-weight: 700; margin: 0;" th:text="${mockTest.title}">Exam</h2>
                    <span style="color: var(--text-secondary); font-size: 13px;" th:text="${questions.size()} + ' Questions Total'">Questions</span>
                </div>
                <div class="timer-box">
                    <i class="bi bi-clock-history"></i> <span id="timer">30:00</span>
                </div>
            </div>

            <!-- Questions Form -->
            <form id="quiz-form" onsubmit="submitExam(event)">
                <div th:each="q, stat : ${questions}" class="question-card glass-panel" th:data-qid="${q.id}">
                    <div style="font-size: 13px; color: var(--primary-color); font-weight: 700; margin-bottom: 8px;" th:text="'QUESTION ' + ${stat.index + 1}">QUESTION 1</div>
                    <div class="question-text" th:text="${q.questionText}">Question text goes here?</div>

                    <div class="options-list">
                        <div class="option-item" onclick="selectOption(this, 'A')">
                            <div class="option-marker">A</div>
                            <span th:text="${q.optionA}">Option A</span>
                            <input type="radio" th:name="'q_' + ${q.id}" value="A" style="display:none;">
                        </div>
                        <div class="option-item" onclick="selectOption(this, 'B')">
                            <div class="option-marker">B</div>
                            <span th:text="${q.optionB}">Option B</span>
                            <input type="radio" th:name="'q_' + ${q.id}" value="B" style="display:none;">
                        </div>
                        <div class="option-item" onclick="selectOption(this, 'C')">
                            <div class="option-marker">C</div>
                            <span th:text="${q.optionC}">Option C</span>
                            <input type="radio" th:name="'q_' + ${q.id}" value="C" style="display:none;">
                        </div>
                        <div class="option-item" onclick="selectOption(this, 'D')">
                            <div class="option-marker">D</div>
                            <span th:text="${q.optionD}">Option D</span>
                            <input type="radio" th:name="'q_' + ${q.id}" value="D" style="display:none;">
                        </div>
                    </div>
                </div>

                <div class="quiz-footer">
                    <a href="/student/dashboard" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i> Cancel Exam</a>
                    <button type="submit" class="btn btn-primary" style="padding: 12px 30px;"><i class="bi bi-send-check-fill me-1"></i> Submit Exam</button>
                </div>
            </form>
        </div>

        <!-- Result Screen (Hidden by Default) -->
        <div id="result-screen" class="result-card glass-panel" style="display: none;">
            <i class="bi bi-trophy-fill" style="font-size: 48px; color: #fbbf24;"></i>
            <h2 style="font-size: 28px; font-weight: 800; margin-top: 15px;">Exam Completed!</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Here is your calculated score breakdown</p>

            <div class="score-circle">
                <span id="score-text" class="score-val">0/0</span>
                <span class="score-lbl">Score</span>
            </div>

            <p id="percentage-text" style="font-size: 20px; font-weight: 700; margin-bottom: 30px; color: #34d399;">100% Correct</p>

            <a href="/student/dashboard" class="btn btn-primary" style="padding: 12px 30px;"><i class="bi bi-arrow-left me-1"></i> Return to Dashboard</a>
        </div>
    </main>

    <script th:inline="javascript">
        let durationMins = /*[[${mockTest.duration}]]*/ 30;
        let timeRemaining = durationMins * 60;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                document.getElementById('timer').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up! Submitting exam automatically.");
                    document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
                }
            }, 1000);
        }

        function selectOption(element, val) {
            const list = element.parentElement;
            list.querySelectorAll('.option-item').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            const radio = element.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        }

        async function submitExam(event) {
            event.preventDefault();
            clearInterval(timerInterval);

            const studentId = /*[[${user != null ? user.id : 0}]]*/ 0;
            const mockTestId = /*[[${mockTest.id}]]*/ 0;
            const cards = document.querySelectorAll('.question-card');
            
            const answers = {};
            cards.forEach(card => {
                const qid = card.getAttribute('data-qid');
                const checked = card.querySelector('input[type="radio"]:checked');
                if (checked) {
                    answers[qid] = checked.value;
                }
            });

            try {
                const response = await fetch(`/mock-test/submit?studentId=${studentId}&mockTestId=${mockTestId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(answers)
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('quiz-screen').style.display = 'none';
                    document.getElementById('result-screen').style.display = 'block';

                    document.getElementById('score-text').textContent = `${result.score}/${result.totalQuestions}`;
                    const pct = Math.round((result.score / result.totalQuestions) * 100) || 0;
                    document.getElementById('percentage-text').textContent = `${pct}% Correct (${result.score} out of ${result.totalQuestions})`;
                } else {
                    alert("Failed to evaluate test.");
                }
            } catch (err) {
                alert("Network error submitting exam.");
            }
        }

        window.addEventListener('DOMContentLoaded', startTimer);
    </script>
</body>
</html>
