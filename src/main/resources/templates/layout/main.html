<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">CourseHub - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="glass-header">
        <div class="container nav-wrapper">
            <a class="brand-logo" href="/admin/dashboard"><i class="bi bi-rocket-takeoff-fill"></i> CourseHub</a>
            <nav class="nav-links">
                <a class="nav-link" href="/admin/dashboard"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
                <a class="nav-link" href="/admin/students"><i class="bi bi-people-fill me-1"></i> Students</a>
                <a class="nav-link" href="/admin/trainers"><i class="bi bi-person-badge-fill me-1"></i> Trainers</a>
                <a class="nav-link" href="/admin/courses"><i class="bi bi-journal-bookmark-fill me-1"></i> Courses</a>
                <a class="nav-link" href="/admin/enrollments"><i class="bi bi-card-checklist me-1"></i> Enrollments</a>
                <a href="/logout" class="btn btn-danger" style="padding: 6px 12px; font-size: 13px;">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="padding-top: 32px; padding-bottom: 32px;" th:replace="${content}"></main>

    <footer>
        <div class="container">
            <p>&copy; 2026 CourseHub. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
