<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Trainers - Admin', ~{::section})}">
<body>
    <section>
        <div style="margin-bottom: 28px;">
            <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 6px;">All Trainers</h1>
            <p style="color: var(--text-secondary); margin: 0; font-size: 15px;">Review instructor profiles and manage approvals.</p>
        </div>

        <div class="glass-panel" style="overflow: hidden;">
            <table class="glass-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Trainer Info</th>
                        <th>Specialization</th>
                        <th>Experience</th>
                        <th>Verified</th>
                        <th>Approval Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="trainer : ${trainers}">
                        <td style="color: var(--text-secondary); font-weight: 600;" th:text="'#' + ${trainer.id}">#1</td>
                        <td>
                            <div style="font-weight: 700;" th:text="${trainer.name}">Jane Smith</div>
                            <div style="color: var(--text-secondary); font-size: 13px;" th:text="${trainer.email}">jane@example.com</div>
                        </td>
                        <td><span class="badge-custom badge-info" th:text="${trainer.specialization}">Java</span></td>
                        <td style="font-weight: 600;" th:text="${trainer.experience} + ' Years'">5 Years</td>
                        <td>
                            <span th:if="${trainer.verified}" class="badge-custom badge-success"><i class="bi bi-patch-check-fill"></i> Verified</span>
                            <span th:unless="${trainer.verified}" class="badge-custom badge-danger"><i class="bi bi-x-circle-fill"></i> Unverified</span>
                        </td>
                        <td>
                            <span th:if="${trainer.approved}" class="badge-custom badge-success"><i class="bi bi-check-lg"></i> Approved</span>
                            <button th:unless="${trainer.approved}" class="btn btn-primary" style="padding: 6px 14px; font-size: 13px;" th:onclick="'approveUser(' + ${trainer.id} + ')'">
                                <i class="bi bi-person-check-fill"></i> Approve
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script>
            async function approveUser(userId) {
                if (confirm('Approve this trainer?')) {
                    try {
                        const response = await fetch(`/admin/approve/${userId}`, { method: 'POST' });
                        if (response.ok) window.location.reload();
                    } catch (err) { alert('Error approving user'); }
                }
            }
        </script>
    </section>
</body>
</html>
