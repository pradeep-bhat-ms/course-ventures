<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Dashboard - Admin', ~{::section})}">
<body>
    <section>
        <div class="mb-4" style="margin-bottom: 28px;">
            <h1 class="hero-title" style="font-size: 34px; text-align: left; margin-bottom: 6px;">Platform Statistics</h1>
            <p class="hero-subtitle" style="text-align: left; margin: 0; font-size: 15px;">Real-time analytics on users, course growth, and platform activity.</p>
        </div>

        <style>
            .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
            .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
            .stat-card { padding: 28px; position: relative; overflow: hidden; }
            .stat-icon { font-size: 32px; position: absolute; top: 24px; right: 24px; opacity: 0.35; }
            .stat-value { font-size: 42px; font-weight: 800; margin: 12px 0 6px; color: var(--text-primary); }
        </style>

        <div class="grid-4 mb-4" style="margin-bottom: 24px;">
            <div class="glass-panel stat-card">
                <i class="bi bi-people-fill stat-icon" style="color: #6366f1;"></i>
                <span class="course-category" style="color: #818cf8;">Total Students</span>
                <div class="stat-value" th:text="${statistics.totalStudents}">0</div>
                <span class="badge-custom badge-info"><i class="bi bi-person-check-fill"></i> Active Learners</span>
            </div>

            <div class="glass-panel stat-card">
                <i class="bi bi-person-badge-fill stat-icon" style="color: #10b981;"></i>
                <span class="course-category" style="color: #34d399;">Total Trainers</span>
                <div class="stat-value" th:text="${statistics.totalTrainers}">0</div>
                <span class="badge-custom badge-success"><i class="bi bi-shield-check"></i> Verified Instructors</span>
            </div>

            <div class="glass-panel stat-card">
                <i class="bi bi-journal-bookmark-fill stat-icon" style="color: #06b6d4;"></i>
                <span class="course-category" style="color: #38bdf8;">Total Courses</span>
                <div class="stat-value" th:text="${statistics.totalCourses}">0</div>
                <span class="badge-custom badge-info"><i class="bi bi-book-half"></i> Active Catalog</span>
            </div>

            <div class="glass-panel stat-card">
                <i class="bi bi-card-checklist stat-icon" style="color: #f59e0b;"></i>
                <span class="course-category" style="color: #fbbf24;">Total Enrollments</span>
                <div class="stat-value" th:text="${statistics.totalEnrollments}">0</div>
                <span class="badge-custom badge-warning"><i class="bi bi-graph-up-arrow"></i> Registrations</span>
            </div>
        </div>

        <div class="grid-2">
            <div class="glass-panel stat-card">
                <i class="bi bi-award-fill stat-icon" style="color: #a855f7;"></i>
                <span class="course-category" style="color: #c084fc;">Completed Courses</span>
                <div class="stat-value" th:text="${statistics.completedCourses}">0</div>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">Certificates earned by students across all modules.</p>
            </div>
        </div>
    </section>
</body>
</html>
